services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - .:/app
    depends_on:
      - db
      - redis
      - mail
    command: >
      sh -c "pnpm start:dev"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - .:/app
    depends_on:
      - db
      - redis
    command: >
      sh -c "pnpm start:dev"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${DATABASE_USERNAME}'
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD}'
      POSTGRES_DB: '${DATABASE_NAME}'
      TZ: 'UTC'
    ports:
      - '${DOCKER_DATABASE_PORT}:5432'
    volumes:
      - ./.docker/postgres_data:/var/lib/postgresql/data
    networks:
      - my-nestjs-network

  mail:
    image: axllent/mailpit:v1.25
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - ${DOCKER_MAIL_PORT}:1025
      - ${DOCKER_MAIL_CLIENT_PORT}:8025
    networks:
      - my-nestjs-network

  schemaspy:
    image: schemaspy/schemaspy:latest
    volumes:
      - ./docs/schemaspy.properties:/schemaspy.properties
      - ./docs/db_schema_diagram:/output
      - ./docs/drivers:/drivers
    command: -configFile /schemaspy.properties -debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-nestjs-network
    restart: "no"
